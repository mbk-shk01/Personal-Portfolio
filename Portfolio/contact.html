<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mubarak Ladipo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <a class="logo" href="index.html">MUBARAK OLALEKAN LADIPO</a>

            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="education.html">Education</a></li>
                    <li><a href="skills.html">Skills</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li>
                        <a href="contact.html" aria-current="page">
                            Contact
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>


    <main>

        <section class="page-intro">
            <div class="container">
                <h1>Contact Me</h1>

                <p>
                    Feel free to send me a message.
                </p>
            </div>
        </section>


        <section class="section">
            <div class="container form-container">

                <form>

                    <fieldset>

                        <legend>Your Information</legend>

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                        >


                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >

                    </fieldset>


                    <fieldset>

                        <legend>Your Message</legend>

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                        >


                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="8"
                            required
                        ></textarea>

                    </fieldset>


                    <button type="submit">
                        Send Message
                    </button>

                    <button type="reset" class="secondary-button">
                        Clear Form
                    </button>

                </form>

            </div>
        </section>

    </main>


    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Mubarak Ladipo. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
